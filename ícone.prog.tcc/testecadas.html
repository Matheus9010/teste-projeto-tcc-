<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="testecadas.css">
    <title>Cadastro</title>
</head>
<body>
          
       <div class="contato-grid">
            <div class="form-box">
                <h2>Envie uma mensagem</h2>
                <form id="contatoForm">
                    <div class="form-group">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(41) 9....-....">
                    </div>
                    <div class="form-group">
                        <label for="assunto">Assunto</label>
                        <select id="assunto" name="assunto">
                            <option>Quero conhecer a academia</option>
                            <option>Planos e valores</option>
                            <option>Treinos e modalidades</option>
                            <option>Suporte / dúvida geral</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="observacao">Observação (Opcional)</label>
                        <textarea id="observacao" name="observacao"></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Enviar mensagem</button>
                    <p id="formStatus"></p>
                </form>
            </div>
</body>
</html>
