<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/1ab94d0eba.js" crossorigin="anonymous"></script>
    <title>Login</title>
    <link rel="stylesheet" href="login02.css">
</head>
<body>

    <div class="main">
        <div class="logo">
            <img src="Protótipo_TCC__3.png">
        </div>
    </div>
    
    <main class="container">
        <h2>Login</h2>
        <form action="#" method="get" id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-field">
                <input type="email" name="username" id="username" placeholder="Email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
                <div class="underline"></div>
            </div>
            <div class="input-field password-field">
                <input type="password" name="password" id="password" placeholder="Senha" required>
                <i class="fas fa-eye toggle-password"></i>
                <div class="underline"></div>
            </div>
            <input type="submit" value="Continue">
        </form>
        
        <div class="footer">
            <div class="barra-recuperar-senha">
                <a href="index.html">
                    <i class="fas fa-key"></i>
                    Recuperar Senha
                </a>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            const togglePassword = document.querySelector('.toggle-password');
            const passwordInput = document.querySelector('#password');
            
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });

            const usernameInput = document.getElementById('username');
            const emailPattern = /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/;
            
            usernameInput.addEventListener('input', function() {
                if (this.value && !emailPattern.test(this.value)) {
                    this.setCustomValidity('Digite um email válido (ex: usuario@gmail.com)');
                } else {
                    this.setCustomValidity('');
                }
            });
        });

        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (email && password) {

                const initials = getInitialsFromEmail(email);
                
                localStorage.setItem('loggedInUser', JSON.stringify({
                    email: email,
                    initials: initials,
                    loggedIn: true
                }));
                
                alert('Login realizado com sucesso!');
                window.location.href = 'Início.html';
            } else {
                alert('Por favor, preencha todos os campos!');
            }
        }

        function getInitialsFromEmail(email) {
            const namePart = email.split('@')[0].toUpperCase();
            const parts = namePart.split('.');
            let initials = parts[0][0];
            
            if (parts.length > 1) {
                initials += parts[1][0];
            } else {
                initials += namePart[1] || '';
            }
            
            return initials;
        }
    </script>
</body>
</html>
